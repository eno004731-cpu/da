services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: legal_auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    restart: "no"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

  frontend:
    build:
      context: ./front
    restart: "no"
    environment:
      LEGAL_FRONTEND_PORT: 8000
    volumes:
      # Frontend контейнер читает актуальный front/.env и статику
      # прямо из checkout, чтобы test/prod runtime config не запекался в image.
      - ./front:/app:ro
    ports:
      - "127.0.0.1:8000:8000"

  auth-service:
    build:
      context: ./auth_service/legal_website
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legal_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-30}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS}
    ports:
      - "${AUTH_PUBLIC_PORT:-8081}:8081"

  order-service:
    build:
      context: ./order-service/order-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legal_orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_TOPIC_DOCUMENT_VALIDATION_RESULT: ${APP_KAFKA_TOPIC_DOCUMENT_VALIDATION_RESULT:?copy document-validation.env.example values to .env}
      APP_DOCUMENT_VALIDATION_OUTBOX_DELAY_MS: ${APP_DOCUMENT_VALIDATION_OUTBOX_DELAY_MS:?copy document-validation.env.example values to .env}
      JWT_SECRET: ${JWT_SECRET}
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://127.0.0.1:*,http://localhost:*}
    ports:
      - "${ORDER_PUBLIC_PORT:-8083}:8083"

  catalog-service:
    build:
      context: ./catalog-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legal_catalog
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${CATALOG_PUBLIC_PORT:-8084}:8084"

  document-service:
    build:
      context: ./document-service
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legal_documents
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_TOPIC_DOCUMENT_VALIDATION_RESULT: ${APP_KAFKA_TOPIC_DOCUMENT_VALIDATION_RESULT:?copy document-validation.env.example values to .env}
      APP_DOCUMENT_OUTBOX_RELAY_DELAY_MS: ${APP_DOCUMENT_OUTBOX_RELAY_DELAY_MS:?copy document-validation.env.example values to .env}
      APP_DOCUMENT_VALIDATION_RETRY_SCAN_DELAY_MS: ${APP_DOCUMENT_VALIDATION_RETRY_SCAN_DELAY_MS:?copy document-validation.env.example values to .env}
      APP_DOCUMENT_VALIDATION_RETRY_AFTER_SECONDS: ${APP_DOCUMENT_VALIDATION_RETRY_AFTER_SECONDS:?copy document-validation.env.example values to .env}
      JWT_SECRET: ${JWT_SECRET}
      APP_INTERNAL_SERVICE_TOKEN: ${APP_INTERNAL_SERVICE_TOKEN}
      APP_STORAGE_DOCUMENTS_DIR: /data/documents
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-http://127.0.0.1:*,http://localhost:*}
    volumes:
      - document_storage:/data/documents
    ports:
      - "${DOCUMENT_PUBLIC_PORT:-8085}:8085"

  notification-service:
    build:
      context: ./notification-service/Notification
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legal_notification
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM}

volumes:
  postgres_data:
  kafka_data:
  document_storage:
