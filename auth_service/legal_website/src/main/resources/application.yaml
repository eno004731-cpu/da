spring:
  application:
    name: legal-website-auth

  config:
    import: optional:file:/Users/nikitatukan/Documents/.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_auth}
    username: ${SPRING_DATASOURCE_USERNAME:legal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:legal_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

jwt:
  # Секрет для подписи access token. Приходит из .env или env переменных.
  secret: ${JWT_SECRET}
  # Время жизни access token в минутах.
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  # Время жизни refresh token в днях.
  refresh-days: ${JWT_REFRESH_DAYS:30}

google:
  # Client ID нужен для проверки audience у Google ID token.
  client-id: ${GOOGLE_CLIENT_ID:}

logging:
  level:
    org.springframework.security: INFO
