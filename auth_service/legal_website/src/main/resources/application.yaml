spring:
  application:
    name: legal-website-auth

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_auth}
    username: ${SPRING_DATASOURCE_USERNAME:legal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:legal_pass}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

jwt:
  # Секрет для подписи access token. Приходит из .env или env переменных.
  secret: ${JWT_SECRET}
  # Время жизни access token в минутах.
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  # Время жизни refresh token в днях.
  refresh-days: ${JWT_REFRESH_DAYS:30}

google:
  # Client ID нужен для проверки audience у Google ID token.
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:3000}
  kafka:
    topics:
      delete-user-orders: ${APP_KAFKA_TOPIC_DELETE_USER_ORDERS:user.delete-orders.requested}
      delete-user-documents: ${APP_KAFKA_TOPIC_DELETE_USER_DOCUMENTS:user.delete-documents.requested}
  outbox:
    delete:
      fixed-delay-ms: ${APP_DELETE_OUTBOX_FIXED_DELAY_MS:5000}
      # 180 секунд: Kafka delivery timeout (120 секунд) + запас для callback.
      processing-timeout-ms: ${APP_DELETE_PROCESSING_TIMEOUT_MS:180000}
      callback-executor:
        core-pool-size: ${APP_DELETE_CALLBACK_CORE_POOL_SIZE:2}
        max-pool-size: ${APP_DELETE_CALLBACK_MAX_POOL_SIZE:4}
        queue-capacity: ${APP_DELETE_CALLBACK_QUEUE_CAPACITY:100}

logging:
  level:
    org.springframework.security: INFO
