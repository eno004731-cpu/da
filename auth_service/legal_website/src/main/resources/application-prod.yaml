spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8081}

jwt:
  secret: ${JWT_SECRET}
  access-minutes: ${JWT_ACCESS_MINUTES:15}
  refresh-days: ${JWT_REFRESH_DAYS:30}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

app:
  frontend-base-url: ${APP_FRONTEND_BASE_URL}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:*,http://localhost:*}
  kafka:
    topics:
      delete-user-orders: ${APP_KAFKA_TOPIC_DELETE_USER_ORDERS:user.delete-orders.requested}
      delete-user-documents: ${APP_KAFKA_TOPIC_DELETE_USER_DOCUMENTS:user.delete-documents.requested}
  outbox:
    delete:
      fixed-delay-ms: ${APP_DELETE_OUTBOX_FIXED_DELAY_MS:5000}
      processing-timeout-ms: ${APP_DELETE_PROCESSING_TIMEOUT_MS:180000}
      callback-executor:
        core-pool-size: ${APP_DELETE_CALLBACK_CORE_POOL_SIZE:2}
        max-pool-size: ${APP_DELETE_CALLBACK_MAX_POOL_SIZE:4}
        queue-capacity: ${APP_DELETE_CALLBACK_QUEUE_CAPACITY:100}
