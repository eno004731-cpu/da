spring:
  application:
    name: order-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_orders}
    username: ${SPRING_DATASOURCE_USERNAME:legal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:legal_pass}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "order_service.Dto.payload"
        spring.json.use.type.headers: false
      max-poll-records: 100
    listener:
      ack-mode: record

    
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET}

server:
  port: ${SERVER_PORT:8083}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:*,http://localhost:*}
  external:
    catalog-service-base-url: ${APP_CATALOG_SERVICE_BASE_URL:http://127.0.0.1:8084}
    document-service-base-url: ${APP_DOCUMENT_SERVICE_BASE_URL:http://127.0.0.1:8085}
  internal:
    service-token: ${APP_INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
  kafka:
    topics:
      catalog-get-service-name-request: ${APP_KAFKA_TOPIC_CATALOG_GET_SERVICE_NAME_REQUEST:order.getServiceName.request}
      catalog-get-service-name-response: ${APP_KAFKA_TOPIC_CATALOG_GET_SERVICE_NAME_RESPONSE:order.getServiceName.response}
      document-stored: ${APP_KAFKA_TOPIC_DOCUMENT_STORED:document.stored}
