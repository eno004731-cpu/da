spring:
  application:
    name: document-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legal_documents}
    username: ${SPRING_DATASOURCE_USERNAME:legal_user}
    password: ${SPRING_DATASOURCE_PASSWORD:legal_pass}
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: document-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
      max-poll-records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      # Ограничение применяется к одному файлу.
      max-file-size: ${APP_DOCUMENT_MAX_FILE_SIZE:10MB}
      # Общий лимит запроса позволяет отправлять несколько файлов.
      max-request-size: ${APP_DOCUMENT_MAX_REQUEST_SIZE:30MB}

jwt:
  # Document-service самостоятельно проверяет тот же access token, что и другие API.
  secret: ${JWT_SECRET}

app:
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://127.0.0.1:*,http://localhost:*}
  internal:
    service-token: ${APP_INTERNAL_SERVICE_TOKEN:local-dev-internal-token}
  storage:
    documents-dir: ${APP_STORAGE_DOCUMENTS_DIR:uploads/documents}
  kafka:
    topics:
      document-stored: ${APP_KAFKA_TOPIC_DOCUMENT_STORED:document.stored}
      document-delete-requested: ${APP_KAFKA_TOPIC_DOCUMENT_DELETE_REQUESTED:document.delete-requested}
      document-deleted: ${APP_KAFKA_TOPIC_DOCUMENT_DELETED:document.deleted}
      document-validation-result: ${APP_KAFKA_TOPIC_DOCUMENT_VALIDATION_RESULT}
  outbox-relay:
    fixed-delay-ms: ${APP_DOCUMENT_OUTBOX_RELAY_DELAY_MS}
  validation:
    retry-scan-delay-ms: ${APP_DOCUMENT_VALIDATION_RETRY_SCAN_DELAY_MS}
    retry-after-seconds: ${APP_DOCUMENT_VALIDATION_RETRY_AFTER_SECONDS}
server:
  port: ${SERVER_PORT:8085}
